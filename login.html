<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Alwination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="js/auth.js"></script>
</head>
<body data-auth-page="login">
  <header class="topbar">
    <a class="brand" href="login.html">
      <img class="brand__image" src="img/alwination-logo.png" alt="Alwination — Pusat laporan bug">
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-panel">
      <p class="eyebrow">Akses terbatas</p>
      <h1>Masuk ke pusat laporan</h1>
      <p class="muted">Gunakan akun Google yang telah diizinkan untuk melanjutkan.</p>
      <button class="btn btn--primary" id="google-sign-in" type="button">
        <i data-lucide="log-in"></i>Masuk dengan Google
      </button>
      <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>window.lucide && lucide.createIcons();</script>
</body>
</html>
